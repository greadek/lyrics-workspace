[pytest]
# 只收集 test 开头的测试文件
testpaths = .
python_files = test_*.py
# 失败后保留浏览器现场，便于调试
# --maxfail=3 遇到 3 个失败即停止
addopts = --maxfail=3 -q

# 常用命令行示例：
#   pytest                          # 全部测试
#   pytest test_example.py -k title # 只运行名称含 title 的测试
#   pytest --headed                 # 有头模式（看到浏览器操作）
#   pytest --browser firefox        # 指定浏览器
#   pytest --browser chromium --browser webkit  # 多浏览器兼容测试
#   pytest --tracing on             # 生成追踪，可用 trace viewer 查看
